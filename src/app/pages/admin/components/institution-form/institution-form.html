
<div class="card">

  <div class="mb-5">
    <h2 class="m-0">Institución</h2>
    <p class="text-color-secondary mt-2">
      Complete la información institucional.
    </p>
  </div>

  <!-- ========================= -->
  <!-- GENERAL INFO -->
  <!-- ========================= -->

  <div class="mb-5">
    <h4 class="mb-4">General Info</h4>

    <div class="grid">

      <div class="col-12 md:col-4">
        <label class="block mb-2 font-medium">
          Nombre
        </label>

        <input
          pInputText
          class="w-full"
          [formField]="form.generalInfo.name" />

        <small
          [appErrorMessage]="$any(form.generalInfo.name)">
        </small>
      </div>

      <div class="col-12 md:col-4">
        <label class="block mb-2 font-medium">
          Denominación
        </label>

        <input
          pInputText
          class="w-full"
          [formField]="form.generalInfo.denomination" />

        <small
          [appErrorMessage]="$any(form.generalInfo.denomination)">
        </small>
      </div>

      <div class="col-12 md:col-4">
        <label class="block mb-2 font-medium">
          Nombre Corto
        </label>

        <input
          pInputText
          class="w-full"
          [formField]="form.generalInfo.shortName" />

        <small
          [appErrorMessage]="$any(form.generalInfo.shortName)">
        </small>
      </div>

    </div>
  </div>

  <!-- ========================= -->
  <!-- CONTACT INFO -->
  <!-- ========================= -->

  <div class="mb-5">
    <h4 class="mb-4">Contact Info</h4>

    <div class="grid">

      <div class="col-12 md:col-3">
        <label class="block mb-2 font-medium">
          Celular
        </label>

        <input
          pInputText
          class="w-full"
          [formField]="form.contactInfo.cellphone" />

        <small
          [appErrorMessage]="$any(form.contactInfo.cellphone)">
        </small>
      </div>

      <div class="col-12 md:col-3">
        <label class="block mb-2 font-medium">
          Teléfono
        </label>

        <input
          pInputText
          class="w-full"
          [formField]="form.contactInfo.phone" />

        <small
          [appErrorMessage]="$any(form.contactInfo.phone)">
        </small>
      </div>

      <div class="col-12 md:col-3">
        <label class="block mb-2 font-medium">
          Email
        </label>

        <input
          pInputText
          class="w-full"
          [formField]="form.contactInfo.email" />

        <small
          [appErrorMessage]="$any(form.contactInfo.email)">
        </small>
      </div>

      <div class="col-12 md:col-3">
        <label class="block mb-2 font-medium">
          Web
        </label>

        <input
          pInputText
          class="w-full"
          [formField]="form.contactInfo.web" />

        <small
          [appErrorMessage]="$any(form.contactInfo.web)">
        </small>
      </div>

    </div>
  </div>

  <!-- ========================= -->
  <!-- CONFIGURATION INFO -->
  <!-- ========================= -->

  <div class="mb-5">
    <h4 class="mb-4">Configuration Info</h4>

    <div class="grid">

      <div class="col-12 md:col-4">
        <label class="block mb-2 font-medium">
          Logo
        </label>

        <input
          pInputText
          class="w-full"
          [formField]="form.configurationInfo.logo" />

        <small
          [appErrorMessage]="$any(form.configurationInfo.logo)">
        </small>
      </div>

      <div class="col-12 md:col-4">
        <label class="block mb-2 font-medium">
          Estado
        </label>

        <select
          class="w-full p-inputtext"
          [formField]="$any(form.configurationInfo.state)">

          <option value="">
            Seleccione
          </option>

          @for (state of statesOptions(); track state.id) {
            <option [value]="state.id">
              {{ state.name }}
            </option>
          }

        </select>

        <small
          [appErrorMessage]="$any(form.configurationInfo.state)">
        </small>
      </div>

      <div class="col-12 md:col-4">

        <label class="block mb-3 font-medium">
          Visible
        </label>

        <p-toggleSwitch
          [formField]="form.configurationInfo.isVisible">
        </p-toggleSwitch>

      </div>

    </div>
  </div>

  <!-- ========================= -->
  <!-- INSTITUTIONAL INFO -->
  <!-- ========================= -->

  <div class="mb-5">
    <h4 class="mb-4">Institutional Info</h4>

    <div class="grid">

      <div class="col-12 md:col-3">
        <label class="block mb-2 font-medium">
          Código
        </label>

        <input
          pInputText
          class="w-full"
          [formField]="form.institutionalInfo.code" />

        <small
          [appErrorMessage]="$any(form.institutionalInfo.code)">
        </small>
      </div>

      <div class="col-12 md:col-3">
        <label class="block mb-2 font-medium">
          Código SNIESE
        </label>

        <input
          pInputText
          class="w-full"
          [formField]="form.institutionalInfo.codeSniese" />

        <small
          [appErrorMessage]="$any(form.institutionalInfo.codeSniese)">
        </small>
      </div>

      <div class="col-12 md:col-3">
        <label class="block mb-2 font-medium">
          Siglas
        </label>

        <input
          pInputText
          class="w-full"
          [formField]="form.institutionalInfo.acronym" />

        <small
          [appErrorMessage]="$any(form.institutionalInfo.acronym)">
        </small>
      </div>

      <div class="col-12 md:col-3">
        <label class="block mb-2 font-medium">
          Slogan
        </label>

        <input
          pInputText
          class="w-full"
          [formField]="form.institutionalInfo.slogan" />

        <small
          [appErrorMessage]="$any(form.institutionalInfo.slogan)">
        </small>
      </div>

    </div>
  </div>

  <!-- ========================= -->
  <!-- ACTIONS -->
  <!-- ========================= -->

  <div class="flex justify-content-end gap-2">

    <p-button 
      [disabled]="form().invalid()"
      label="Guardar"
      icon="pi pi-save"
      (onClick)="save()">
    </p-button>

  </div>

</div>
