<div class="custom-form-card">
    <form class="custom-form-grid md:grid-cols-12">

        <!-- Encabezado -->
        <div class="custom-form-section md:col-span-12">
            <h4>Registro de Institución</h4>
        </div>

        <!-- Código -->
        <div class="custom-form-field md:col-span-6">
            <label
                appLabel
                for="code"
                label="Código"
                [field]="formData.code">
            </label>

            <input pInputText id="code" [formField]="formData.code">

            <small [appErrorMessage]="$any(formData.code)"></small>
        </div>

        <!-- Código SNIESE -->
        <div class="custom-form-field md:col-span-6">
            <label
                appLabel
                for="codeSniese"
                label="Código SNIESE"
                [field]="formData.codeSniese">
            </label>

            <input pInputText id="codeSniese" [formField]="formData.codeSniese">

            <small [appErrorMessage]="$any(formData.codeSniese)"></small>
        </div>

        <!-- Nombre -->
        <div class="custom-form-field md:col-span-6">
            <label
                appLabel
                for="name"
                label="Nombre"
                [field]="formData.name">
            </label>

            <input pInputText id="name" [formField]="formData.name">

            <small [appErrorMessage]="$any(formData.name)"></small>
        </div>

        <!-- Nombre corto -->
        <div class="custom-form-field md:col-span-6">
            <label
                appLabel
                for="shortName"
                label="Nombre Corto"
                [field]="formData.shortName">
            </label>

            <input pInputText id="shortName" [formField]="formData.shortName">

            <small [appErrorMessage]="$any(formData.shortName)"></small>
        </div>

        <!-- Denominación -->
        <div class="custom-form-field md:col-span-6">
            <label
                appLabel
                for="denomination"
                label="Denominación"
                [field]="formData.denomination">
            </label>

            <input pInputText id="denomination" [formField]="formData.denomination">

            <small [appErrorMessage]="$any(formData.denomination)"></small>
        </div>

        <!-- Acrónimo -->
        <div class="custom-form-field md:col-span-6">
            <label
                appLabel
                for="acronym"
                label="Acrónimo"
                [field]="formData.acronym">
            </label>

            <input pInputText id="acronym" [formField]="formData.acronym">

            <small [appErrorMessage]="$any(formData.acronym)"></small>
        </div>

        <!-- Teléfono convencional -->
        <div class="custom-form-field md:col-span-6">
            <label
                appLabel
                for="phone"
                label="Teléfono"
                [field]="formData.phone">
            </label>

            <input
                pInputText
                id="phone"
                inputmode="numeric"
                autocomplete="off"
                [formField]="formData.phone"
                (input)="onNumericInput($event, 'phone')">

            <small [appErrorMessage]="$any(formData.phone)"></small>
        </div>

        <!-- Celular -->
        <div class="custom-form-field md:col-span-6">
            <label
                appLabel
                for="cellphone"
                label="Celular"
                [field]="formData.cellphone">
            </label>

            <input
                pInputText
                id="cellphone"
                inputmode="numeric"
                autocomplete="off"
                [formField]="formData.cellphone"
                (input)="onNumericInput($event, 'cellphone')">

            <small [appErrorMessage]="$any(formData.cellphone)"></small>
        </div>

        <!-- Email -->
        <div class="custom-form-field md:col-span-6">
            <label
                appLabel
                for="email"
                label="Correo electrónico"
                [field]="formData.email">
            </label>

            <input pInputText id="email" type="email" [formField]="formData.email">

            <small [appErrorMessage]="$any(formData.email)"></small>
        </div>

        <!-- Web -->
        <div class="custom-form-field md:col-span-6">
            <label
                appLabel
                for="web"
                label="Sitio web"
                [field]="formData.web">
            </label>

            <input pInputText id="web" [formField]="formData.web">

            <small [appErrorMessage]="$any(formData.web)"></small>
        </div>

        <!-- Slogan -->
        <div class="custom-form-field md:col-span-6">
            <label
                appLabel
                for="slogan"
                label="Slogan"
                [field]="formData.slogan">
            </label>

            <input pInputText id="slogan" [formField]="formData.slogan">

            <small [appErrorMessage]="$any(formData.slogan)"></small>
        </div>

        <!-- Logo -->
        <div class="custom-form-field md:col-span-6">
            <label
                appLabel
                for="logo"
                label="Logo">
            </label>

            <input
                #logoInput
                id="logo"
                type="file"
                accept=".png,.jpg,.jpeg,.webp"
                class="hidden"
                (change)="onLogoSelected($event)">

            <div class="flex items-center gap-3 mt-2">
                <div class="logo-preview" [class.empty]="!logoPreview()">
                    @if (logoPreview()) {
                        <img [src]="logoPreview()" alt="logo">
                    } @else {
                        <i class="pi pi-image"></i>
                    }
                </div>

                <div class="flex flex-col gap-2">
                    <p-button
                        type="button"
                        label="Seleccionar imagen"
                        icon="pi pi-upload"
                        severity="secondary"
                        [outlined]="true"
                        (onClick)="logoInput.click()">
                    </p-button>

                    @if (logoPreview()) {
                        <p-button
                            type="button"
                            label="Quitar"
                            icon="pi pi-times"
                            severity="danger"
                            [text]="true"
                            (onClick)="removeLogo()">
                        </p-button>
                    }
                </div>
            </div>

            <small>Máximo 2 MB · PNG, JPG, JPEG o WEBP.</small>
        </div>

    </form>
</div>
