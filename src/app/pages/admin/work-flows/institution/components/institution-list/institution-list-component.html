<p-table
  #dt
  [value]="items()"
  [tableStyle]="{ 'min-width': '50rem' }"
  stripedRows>

  <ng-template #caption>
    <div class="custom-form-grid">
      <div class="custom-form-grid md:grid-cols-12">

        <div class="custom-form-field md:col-span-8">
          <h2>Listado de Instituciones</h2>
        </div>

        <div class="custom-form-field md:col-span-4">
          <p-input-group>
            <input
              pInputText
              type="text"
              [value]="search()"
              (input)="onSearchInput($event)"
              placeholder="Buscar..."/>

            <p-button
              [icon]="CustomIcons.MAGNIFYING_GLASS_SOLID">
            </p-button>
          </p-input-group>
        </div>

        <div class="custom-form-field md:col-span-12">
          <p-paginator
            (onPageChange)="onPageChange($event)"
            [rows]="pagination().limit"
            [totalRecords]="pagination().totalItems">
          </p-paginator>
        </div>

      </div>
    </div>
  </ng-template>

  <ng-template #header>
    <tr>
      <th>Código</th>
      <th>Nombre</th>
      <th>Nombre Corto</th>
      <th>Siglas</th>
      <th>SNIESE</th>
      <th>
        <p-button
          pTooltip="Crear"
          [icon]="CustomIcons.PLUS_SOLID"
          severity="success"
          (onClick)="goToCreate()">
        </p-button>
      </th>
    </tr>
  </ng-template>

  <ng-template
    #body
    let-item
    let-rowIndex="rowIndex">

    <tr>
      <td>{{ item.code }}</td>
      <td>{{ item.name }}</td>
      <td>{{ item.shortName }}</td>
      <td>{{ item.acronym }}</td>
      <td>{{ item.codeSniese }}</td>
      <td>
        <p-button
          pTooltip="Gestionar"
          [icon]="CustomIcons.ELLIPSIS_VERTICAL_SOLID"
          (click)="onSelect({ item, index: rowIndex })">
        </p-button>
      </td>
    </tr>

  </ng-template>

  <ng-template #footer>
    <tr>
      <td colspan="6">
        En total existen {{ items() ? pagination().totalItems : 0 }} items.
      </td>
    </tr>
  </ng-template>

</p-table>

<app-button-action
  [buttonActions]="buttonActions()"
  [enabled]="isButtonActionsEnabled"
  (isHide)="isButtonActionsEnabled = $event">
</app-button-action>
